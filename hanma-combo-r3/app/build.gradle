plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vhanma.hanmacombocallerr3'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vhanma.hanmacombocallerr3'
        minSdk 23
        targetSdk 34
        versionCode 600
        versionName '6.0.0-Rival3'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../combo-caller/app/src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// R6 causal-combat source payload is SHA-verified by CI before compilation.
