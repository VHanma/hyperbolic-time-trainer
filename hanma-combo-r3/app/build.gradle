plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vhanma.hanmacombocallerr3'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vhanma.hanmacombocallerr3'
        minSdk 23
        targetSdk 34
        versionCode 402
        versionName '4.0.2-Rival3'
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../combo-caller/app/src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
