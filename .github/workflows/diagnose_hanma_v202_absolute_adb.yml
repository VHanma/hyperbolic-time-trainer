name: Diagnose Hanma v2.0.2 Absolute ADB

on:
  workflow_dispatch:
  push:
    branches: [ hanma-arsenal-v2 ]
    paths:
      - '.github/workflows/diagnose_hanma_v202_absolute_adb.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/diagnose_hanma_v202_absolute_adb.yml'

permissions:
  contents: read

jobs:
  android16-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build staged-startup APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat hanma-caller-x/payload.part* > /tmp/hanma-caller-x.b64
          base64 --decode /tmp/hanma-caller-x.b64 > /tmp/hanma-caller-x.tgz
          tar -xzf /tmp/hanma-caller-x.tgz -C hanma-caller-x
          python tools/hotfix_hanma_caller_x_v201.py > evidence/patch.log 2>&1
          python tools/hotfix_hanma_caller_x_v202.py >> evidence/patch.log 2>&1
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-caller-x
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2 > ../evidence/build.log 2>&1
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease >> ../evidence/build.log 2>&1
          cp app/build/outputs/apk/release/app-release.apk ../evidence/Hanma-Combo-Caller-X-v2.0.2.apk

      - name: Boot Android 16 and execute launch proof
        shell: bash
        run: |
          set +e
          mkdir -p evidence .avd
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.avd"
          ADB="$ANDROID_HOME/platform-tools/adb"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          sudo chmod 666 /dev/kvm || true

          yes | "$SDKMANAGER" --licenses > evidence/sdk.log 2>&1 || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64" >> evidence/sdk.log 2>&1
          SDK_STATUS=$?
          echo no | "$AVDMANAGER" create avd --force --name hanma36 --package "system-images;android-36;google_apis;x86_64" --device "pixel_6" >> evidence/sdk.log 2>&1
          AVD_STATUS=$?

          "$ADB" kill-server > evidence/adb-server.log 2>&1 || true
          "$ADB" start-server >> evidence/adb-server.log 2>&1
          ADB_SERVER_STATUS=$?
          "$EMULATOR" -avd hanma36 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > evidence/emulator-host-pid.txt

          DEVICE_READY=0
          for i in $(seq 1 180); do
            STATE=$("$ADB" -s emulator-5554 get-state 2>/dev/null | tr -d '\r')
            if [ "$STATE" = "device" ]; then DEVICE_READY=1; break; fi
            sleep 2
          done
          echo "$DEVICE_READY" > evidence/device-ready.txt

          BOOTED=0
          if [ "$DEVICE_READY" = "1" ]; then
            for i in $(seq 1 180); do
              VALUE=$("$ADB" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$VALUE" = "1" ]; then BOOTED=1; break; fi
              sleep 2
            done
          fi
          echo "$BOOTED" > evidence/booted.txt

          INSTALL_STATUS=99
          START_STATUS=99
          PID_STATUS=99
          TITLE_STATUS=99
          DRILL_STATUS=99
          FATAL_STATUS=99
          if [ "$BOOTED" = "1" ]; then
            APK=evidence/Hanma-Combo-Caller-X-v2.0.2.apk
            PKG=com.vhanma.hanmacallerx
            "$ADB" -s emulator-5554 install -r "$APK" > evidence/install.txt 2>&1
            INSTALL_STATUS=$?
            "$ADB" -s emulator-5554 shell am force-stop "$PKG" >/dev/null 2>&1
            "$ADB" -s emulator-5554 logcat -c
            "$ADB" -s emulator-5554 shell am start -W -n "$PKG/.MainActivity" > evidence/am-start.txt 2>&1
            START_STATUS=$?
            sleep 15
            "$ADB" -s emulator-5554 logcat -d > evidence/logcat.txt 2>&1
            "$ADB" -s emulator-5554 shell pidof "$PKG" > evidence/app-pid.txt 2>&1
            PID_STATUS=$?
            "$ADB" -s emulator-5554 shell uiautomator dump /sdcard/hanma-window.xml > evidence/uiautomator.txt 2>&1
            "$ADB" -s emulator-5554 pull /sdcard/hanma-window.xml evidence/window.xml >> evidence/uiautomator.txt 2>&1
            grep -q 'HANMA COMBO CALLER X' evidence/window.xml
            TITLE_STATUS=$?
            grep -q '2,198 CALLABLE DRILLS' evidence/window.xml
            DRILL_STATUS=$?
            grep -qE 'FATAL EXCEPTION.*main|Process: com.vhanma.hanmacallerx' evidence/logcat.txt
            if [ "$?" = "0" ]; then FATAL_STATUS=1; else FATAL_STATUS=0; fi
          else
            : > evidence/install.txt
            : > evidence/am-start.txt
            : > evidence/app-pid.txt
            : > evidence/logcat.txt
            : > evidence/window.xml
          fi

          STATUS=0
          if [ "$SDK_STATUS" != "0" ]; then STATUS=5; fi
          if [ "$AVD_STATUS" != "0" ]; then STATUS=6; fi
          if [ "$ADB_SERVER_STATUS" != "0" ]; then STATUS=7; fi
          if [ "$DEVICE_READY" != "1" ]; then STATUS=8; fi
          if [ "$BOOTED" != "1" ]; then STATUS=9; fi
          if [ "$INSTALL_STATUS" != "0" ]; then STATUS=10; fi
          if [ "$START_STATUS" != "0" ]; then STATUS=20; fi
          if [ "$PID_STATUS" != "0" ]; then STATUS=30; fi
          if [ "$TITLE_STATUS" != "0" ]; then STATUS=40; fi
          if [ "$DRILL_STATUS" != "0" ]; then STATUS=50; fi
          if [ "$FATAL_STATUS" != "0" ]; then STATUS=60; fi
          echo "$STATUS" > evidence/status.txt

          {
            echo "STATUS=$STATUS"
            echo "SDK_STATUS=$SDK_STATUS"
            echo "AVD_STATUS=$AVD_STATUS"
            echo "ADB_SERVER_STATUS=$ADB_SERVER_STATUS"
            echo "DEVICE_READY=$DEVICE_READY"
            echo "BOOTED=$BOOTED"
            echo "INSTALL_STATUS=$INSTALL_STATUS"
            echo "START_STATUS=$START_STATUS"
            echo "PID_STATUS=$PID_STATUS"
            echo "TITLE_STATUS=$TITLE_STATUS"
            echo "DRILL_STATUS=$DRILL_STATUS"
            echo "FATAL_STATUS=$FATAL_STATUS"
            echo '--- ADB DEVICES ---'
            "$ADB" devices -l
            echo '--- INSTALL ---'
            cat evidence/install.txt
            echo '--- AM START ---'
            cat evidence/am-start.txt
            echo '--- APP PID ---'
            cat evidence/app-pid.txt
            echo '--- APP FATAL EXCERPT ---'
            grep -E -A 35 -B 10 'FATAL EXCEPTION|AndroidRuntime|Process: com.vhanma.hanmacallerx|Unable to start activity|VerifyError|NoClassDefFoundError|Resources.NotFoundException' evidence/logcat.txt | tail -n 220
          } > evidence/result-summary.txt
          cat evidence/result-summary.txt
          kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          exit 0

      - name: Upload evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-v202-absolute-adb-evidence
          path: evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: Require verified live app
        shell: bash
        run: |
          set -euo pipefail
          cat evidence/result-summary.txt
          test "$(cat evidence/status.txt)" = "0"
