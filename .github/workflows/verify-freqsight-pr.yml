name: Verify FREQSIGHT APK

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble MainActivity source
        shell: bash
        run: |
          set -euo pipefail
          cat .freqsight_source/MainActivity.part0 .freqsight_source/MainActivity.part1 > freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java
          test -s freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java
          grep -q 'class MainActivity' freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd freqsight
          gradle --no-daemon clean assembleRelease 2>&1 | tee /tmp/freqsight-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freqsight-build-log
          path: /tmp/freqsight-build.log
          retention-days: 7

      - name: Verify and package downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/FREQSIGHT-v1.0.apk
          cp freqsight/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/FREQSIGHT-v1.0-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          FREQSIGHT V1.0
          Package: com.vhanma.freqsight
          Purpose: stationary fictional environmental signal-to-language installation
          Camera: CameraX live analysis and recording
          Audio: microphone observation plus controlled tone/beacon generator
          Sensors: magnetometer, accelerometer, gyroscope, light sensor
          OCR: ML Kit text recognition
          Filters: 25 observation filters
          Evidence rule: no translation without visible or measurable source
          Scalar feature: scalar-inspired simulation only
          REPORT
          (cd freqsight && zip -qr ../dist/FREQSIGHT-v1.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - name: Upload FREQSIGHT package
        uses: actions/upload-artifact@v4
        with:
          name: freqsight-v1-one-click
          path: dist/*
          if-no-files-found: error
          retention-days: 30
