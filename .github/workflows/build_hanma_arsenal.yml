name: Build Hanma Arsenal Caller APK

on:
  push:
    branches: [ hanma-arsenal-v2 ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate fighter and strategy arsenal
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_hanma_arsenal.py
          python - <<'PY'
          from pathlib import Path
          p=Path('combo-caller/app/src/main/java/com/vhanma/hanmaarsenalcaller/MainActivity.java')
          s=p.read_text()
          old='''        LinkedHashSet<String> seen = new LinkedHashSet<>();
          List<Combo> clean = new ArrayList<>();
          for (Combo combo : allCombos) {
              String key = combo.raw.trim();
              if (key.isEmpty()) continue;
              if (seen.add(key)) clean.add(combo);
          }
          allCombos.clear();
          allCombos.addAll(clean);
'''
          if old not in s:
              raise SystemExit('Expected combo cleanup block missing')
          p.write_text(s.replace(old, '        // Preserve every supplied Pure898 slot and every new tactical chain.\n'))
          PY

      - name: Verify libraries
        shell: bash
        run: |
          set -euo pipefail
          cd combo-caller
          test "$(grep -cve '^\s*$' app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' app/src/main/assets/combos_named.txt)" -eq 498
          test "$(grep -cve '^#\|^\s*$' app/src/main/assets/fighter_combos.tsv)" -eq 1300
          test "$(cut -f1 app/src/main/assets/fighter_combos.tsv | grep -v '^#' | sort -u | wc -l)" -eq 13

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd combo-caller
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd combo-caller
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/hanma-arsenal-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-arsenal-build-log
          path: /tmp/hanma-arsenal-build.log
          retention-days: 7

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Hanma-Arsenal-Caller-v2.0-SIGNED.apk
          cp combo-caller/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then
            echo 'Caller unexpectedly requests a permission'
            exit 1
          fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Hanma-Arsenal-Caller-v2.0-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          HANMA ARSENAL CALLER V2.0
          Package: com.vhanma.hanmaarsenalcaller
          Total calls: 2,198
          Original Pure898 calls: 898
          New fighter and strategy chains: 1,300
          New libraries: 13, each containing 100 calls
          Modes: full random, shuffled without repeat, sequential, individual libraries
          Camera: absent
          Network: absent
          Runtime permissions: none
          Voice: Android offline-capable TextToSpeech
          REPORT
          (cd combo-caller && zip -qr ../dist/Hanma-Arsenal-Caller-v2.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hanma-arsenal-caller-v2-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30
