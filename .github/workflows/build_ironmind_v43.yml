name: Build Iron Mind V4.3 Deep Passive Forge

on:
  push:
    branches: [ v4-hyperbolic-chamber ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Materialize V4.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .ironmind_payload/new/p* | base64 --decode > /tmp/base.tar.gz
          tar -xzf /tmp/base.tar.gz -C "$GITHUB_WORKSPACE"
          cp .ironmind_patch/app-build-v43.gradle app/build.gradle
          cp .ironmind_patch/MainActivity-LiveForge.java app/src/main/java/com/htt/MainActivity.java
          cp .ironmind_patch/StrikeTracker-LiveForge.java app/src/main/java/com/htt/StrikeTracker.java
          cp .ironmind_patch/HudView-LiveForge.java app/src/main/java/com/htt/HudView.java
          cp .ironmind_patch/SpeechEngine-v43.java app/src/main/java/com/htt/SpeechEngine.java
          cp .ironmind_patch/SubliminalView-v43.java app/src/main/java/com/htt/SubliminalView.java
          patch -p0 < .ironmind_patch/MainActivity-v43.patch
          grep -q 'DEEP PASSIVE FORGE' app/src/main/java/com/htt/MainActivity.java
          grep -q 'REPEAT EACH COMBO' app/src/main/java/com/htt/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/IronMind-V4.3-DeepPassive-VariableRepeat.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/IronMind-V4.3-DeepPassive-VariableRepeat.apk > dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging dist/IronMind-V4.3-DeepPassive-VariableRepeat.apk > dist/APK-BADGING-REPORT.txt
          sha256sum dist/IronMind-V4.3-DeepPassive-VariableRepeat.apk > dist/IronMind-V4.3-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          IRON MIND V4.3: DEEP PASSIVE FORGE
          Package: com.vhanma.ironmindv4
          Version: 4.3-DeepPassive-VariableRepeat (code 7)
          Passive methods: Natural Coach, Deep Embed, Masked Visual, Peripheral Prime, Low Contrast Texture, Symbol + Haptic, Fringe Stack
          Speech: clear natural coach, lower-volume reinforcement, ultra-low texture with separate volume controls
          Visual cue timing: 1200, 180, 80, 40, or 20 ms with masking and message reveal
          Combo repeats: 1, 2, 3, 5, 7, 10, or until the round ends; Fusion offers 1, 2, 3, 5, 7, or 10
          Live Forge remains included.
          REPORT
          zip -qr dist/IronMind-V4.3-Source.zip app build.gradle settings.gradle README.md .github .ironmind_patch

      - uses: actions/upload-artifact@v4
        with:
          name: ironmind-v43-deep-passive-variable-repeat
          path: dist/*
          if-no-files-found: error
          retention-days: 30
