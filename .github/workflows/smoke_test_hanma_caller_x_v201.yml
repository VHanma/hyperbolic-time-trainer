name: Smoke Test Hanma Combo Caller X v2.0.1

on:
  workflow_dispatch:
  push:
    branches: [ hanma-arsenal-v2 ]
    paths:
      - '.github/workflows/smoke_test_hanma_caller_x_v201.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/smoke_test_hanma_caller_x_v201.yml'

permissions:
  contents: read

jobs:
  runtime-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rehydrate Android project
        shell: bash
        run: |
          set -euo pipefail
          cat hanma-caller-x/payload.part* > /tmp/hanma-caller-x.b64
          base64 --decode /tmp/hanma-caller-x.b64 > /tmp/hanma-caller-x.tgz
          tar -xzf /tmp/hanma-caller-x.tgz -C hanma-caller-x
          python tools/hotfix_hanma_caller_x_v201.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-caller-x
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=hanma-caller-x/app/build/outputs/apk/release/app-release.apk
            PKG=com.vhanma.hanmacallerx
            adb install -r "$APK"
            adb shell am force-stop "$PKG"
            adb logcat -c
            adb shell am start -W -n "$PKG/.MainActivity" | tee /tmp/am-start.txt
            sleep 10
            adb logcat -d > /tmp/hanma-logcat.txt
            adb shell pidof "$PKG" | tee /tmp/hanma-pid.txt
            test -s /tmp/hanma-pid.txt
            adb shell uiautomator dump /sdcard/hanma-window.xml
            adb pull /sdcard/hanma-window.xml /tmp/hanma-window.xml
            grep -q 'HANMA COMBO CALLER X' /tmp/hanma-window.xml

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-v201-runtime-evidence
          path: |
            /tmp/am-start.txt
            /tmp/hanma-logcat.txt
            /tmp/hanma-pid.txt
            /tmp/hanma-window.xml
          if-no-files-found: warn
          retention-days: 14
