name: Pure Combo Caller Compiler

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify combo files
        run: |
          test "$(wc -l < combo-caller/app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(wc -l < combo-caller/app/src/main/assets/combos_named.txt)" -eq 498

      - name: Preserve duplicate slots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('combo-caller/app/src/main/java/com/vhanma/purecombocaller/MainActivity.java')
          s = p.read_text()
          start = s.index('        LinkedHashSet<String> seen')
          end_marker = '        allCombos.addAll(clean);\n'
          end = s.index(end_marker, start) + len(end_marker)
          s = s[:start] + '        // Preserve all 898 supplied slots.\n' + s[end:]
          p.write_text(s)
          PY

      - name: Install Gradle
        run: |
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          cd combo-caller
          /tmp/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build APK
        run: |
          cd combo-caller
          ./gradlew --no-daemon clean assembleRelease

      - name: Package
        run: |
          mkdir -p output
          cp combo-caller/app/build/outputs/apk/release/app-release.apk output/Pure-Combo-Caller-v1.0.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs output/Pure-Combo-Caller-v1.0.apk > output/SIGNATURE.txt
          "$BUILD_TOOLS/aapt" dump badging output/Pure-Combo-Caller-v1.0.apk > output/BADGING.txt
          if grep -q 'uses-permission:' output/BADGING.txt; then exit 1; fi
          sha256sum output/Pure-Combo-Caller-v1.0.apk > output/SHA256.txt
          (cd combo-caller && zip -qr ../output/Pure-Combo-Caller-v1.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - uses: actions/upload-artifact@v4
        with:
          name: Pure-Combo-Caller-v1.0-Final
          path: output/*
          retention-days: 30

  freqsight:
    if: startsWith(github.head_ref, 'freqsight')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Assemble FREQSIGHT MainActivity
        run: |
          set -euo pipefail
          cat .freqsight_source/MainActivity.part0 .freqsight_source/MainActivity.part1 > freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java
          test -s freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java
          grep -q 'class MainActivity' freqsight/app/src/main/java/com/vhanma/freqsight/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build FREQSIGHT APK
        run: |
          set -o pipefail
          cd freqsight
          gradle --no-daemon clean assembleRelease 2>&1 | tee /tmp/freqsight-build.log

      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freqsight-build-log
          path: /tmp/freqsight-build.log
          retention-days: 7

      - name: Verify and package FREQSIGHT
        run: |
          set -euo pipefail
          mkdir -p freqsight-output
          APK=freqsight-output/FREQSIGHT-v1.0.apk
          cp freqsight/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > freqsight-output/SIGNATURE.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > freqsight-output/BADGING.txt
          unzip -t "$APK" | tail -1 > freqsight-output/ARCHIVE.txt
          sha256sum "$APK" > freqsight-output/FREQSIGHT-v1.0-SHA256.txt
          cat > freqsight-output/BUILD-REPORT.txt <<'REPORT'
          FREQSIGHT V1.0
          Package: com.vhanma.freqsight
          CameraX stationary analysis and video recording
          Microphone frequency observation and correlation
          Magnetometer, accelerometer, gyroscope and light sensor logging
          ML Kit OCR and symbol-cluster evidence rendering
          25 visual filters
          Skywatcher Beacon and scalar-inspired simulation clearly labeled fictional
          No English output without visible or measurable evidence
          REPORT
          (cd freqsight && zip -qr ../freqsight-output/FREQSIGHT-v1.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - uses: actions/upload-artifact@v4
        with:
          name: FREQSIGHT-v1.0-OneClick
          path: freqsight-output/*
          if-no-files-found: error
          retention-days: 30
