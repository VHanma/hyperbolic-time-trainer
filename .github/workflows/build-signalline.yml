name: Build SignalLine APK
on:
  push:
    branches: [ "signalline-rvbot" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct SignalLine source
        run: |
          cat signalline-src.b64.00 signalline-src.b64.01 signalline-src.b64.02 signalline-src.b64.03 > signalline-src.b64
          base64 -d signalline-src.b64 > SignalLine-source-v1.0.0-alpha1-fixed.zip
          unzip -t SignalLine-source-v1.0.0-alpha1-fixed.zip
          mkdir -p build-src
          unzip -q SignalLine-source-v1.0.0-alpha1-fixed.zip -d build-src
      - name: Apply compile fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('build-src/signalline-src/app/src/main/java/com/vhanma/signalline/MainActivity.kt')
          s = main.read_text()
          start = s.index('@Composable fun Home(vm:SignalViewModel)')
          end = s.index('@Composable fun Session(vm:SignalViewModel)')
          home = r'''@Composable
          fun Home(vm: SignalViewModel) {
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(bottom = 24.dp)
              ) {
                  Header("SIGNALLINE")
                  Box(
                      Modifier.padding(horizontal = 16.dp).fillMaxWidth().height(150.dp)
                          .background(Panel, RoundedCornerShape(28.dp))
                  ) {
                      Canvas(Modifier.fillMaxSize()) {
                          for (i in 0..9) {
                              val y = size.height * (i / 10f)
                              drawLine(Cyan.copy(alpha = .08f), Offset(0f, y), Offset(size.width, y))
                          }
                          val path = Path()
                          for (x in 0..size.width.toInt() step 5) {
                              val wave = (sin(x.toDouble() / 28.0) * 22.0 + sin(x.toDouble() / 9.0) * 5.0).toFloat()
                              val y = size.height / 2f + wave
                              if (x == 0) path.moveTo(x.toFloat(), y) else path.lineTo(x.toFloat(), y)
                          }
                          drawPath(path, Cyan, style = Stroke(3f))
                      }
                      Column(Modifier.align(Alignment.Center).padding(24.dp)) {
                          Text("REMOTE VIEWING\nOPERATING ENVIRONMENT", fontWeight = FontWeight.Black, fontSize = 22.sp)
                          Text("Acquire → Commit → Judge → Reveal", color = Soft)
                      }
                  }
                  Spacer(Modifier.height(18.dp))
                  HomeButton("BEGIN BLIND SESSION", "Human CRV Stages I–VI", Icons.Default.Visibility) { vm.startHuman() }
                  HomeButton("AUTONOMOUS RV BOT", "Three blind machine passes", Icons.Default.Memory) { vm.runBot() }
                  HomeButton("ACADEMY", "Protocol drills + stage guide", Icons.Default.School) { vm.screen = Screen.ACADEMY }
                  HomeButton("HISTORY + ANALYTICS", "Past sessions and scores", Icons.Default.QueryStats) { vm.screen = Screen.HISTORY }
                  Text("Acquisition stays target-blind until session lock.", Modifier.padding(20.dp), color = Soft, fontSize = 12.sp)
              }
          }

          @Composable
          fun HomeButton(
              t: String,
              s: String,
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              on: () -> Unit
          ) {
              Card(
                  Modifier.padding(horizontal = 16.dp, vertical = 6.dp).fillMaxWidth().clickable { on() },
                  colors = CardDefaults.cardColors(containerColor = Panel)
              ) {
                  Row(Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(icon, contentDescription = null, tint = Cyan, modifier = Modifier.size(28.dp))
                      Spacer(Modifier.width(16.dp))
                      Column(Modifier.weight(1f)) {
                          Text(t, fontWeight = FontWeight.Bold)
                          Text(s, color = Soft, fontSize = 13.sp)
                      }
                      Icon(Icons.Default.ChevronRight, contentDescription = null, tint = Soft)
                  }
              }
          }

          '''
          s = s[:start] + home + s[end:]
          main.write_text(s)

          gradle = Path('build-src/signalline-src/app/build.gradle.kts')
          g = gradle.read_text()
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in g:
              g = g.replace('    buildFeatures { compose = true; buildConfig = true }', '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true; buildConfig = true }''')
          gradle.write_text(g)
          PY
      - name: Build debug APK
        working-directory: build-src/signalline-src
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SignalLine-v1.0.0-alpha1-debug
          path: build-src/signalline-src/app/build/outputs/apk/debug/app-debug.apk
