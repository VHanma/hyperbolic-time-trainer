name: Build SignalLine APK
on:
  push:
    branches: [ "signalline-rvbot" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct proven project
        run: |
          cat signalline-src.b64.00 signalline-src.b64.01 signalline-src.b64.02 signalline-src.b64.03 > signalline-src.b64
          base64 -d signalline-src.b64 > SignalLine-source-v1.0.0-alpha1-fixed.zip
          unzip -t SignalLine-source-v1.0.0-alpha1-fixed.zip
          mkdir -p build-src
          unzip -q SignalLine-source-v1.0.0-alpha1-fixed.zip -d build-src
      - name: Install Mira v1.2 source
        run: |
          cp signalline-v1.2/MainActivity.kt build-src/signalline-src/app/src/main/java/com/vhanma/signalline/MainActivity.kt
          python - <<'PY'
          from pathlib import Path
          gradle = Path('build-src/signalline-src/app/build.gradle.kts')
          g = gradle.read_text()
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in g:
              g = g.replace('    buildFeatures { compose = true; buildConfig = true }', '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true; buildConfig = true }''')
          gradle.write_text(g)
          PY
      - name: Build Mira v1.2 debug APK
        working-directory: build-src/signalline-src
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SignalLine-v1.2-mira-debug
          path: build-src/signalline-src/app/build/outputs/apk/debug/app-debug.apk
