name: Build Iron Mind V4.3 Deep Passive Forge APK

on:
  push:
    branches: [ master, v4-hyperbolic-chamber ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize V4.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .ironmind_payload/new/p* > /tmp/ironmind_payload.b64
          base64 --decode /tmp/ironmind_payload.b64 > /tmp/ironmind_v4_project.tar.gz
          tar -xzf /tmp/ironmind_v4_project.tar.gz -C "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/java/com/htt
          cat .ironmind_patch/v43/MainActivity.part* > app/src/main/java/com/htt/MainActivity.java
          cat .ironmind_patch/v43/DeepMessageBank.part* > app/src/main/java/com/htt/DeepMessageBank.java
          cat .ironmind_patch/v43/DeepEmbedView.part* > app/src/main/java/com/htt/DeepEmbedView.java
          cat .ironmind_patch/v43/SpeechEngine.part* > app/src/main/java/com/htt/SpeechEngine.java
          cp .ironmind_patch/v43/app-build.gradle app/build.gradle
          cp .ironmind_patch/v43/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp .ironmind_patch/StrikeTracker-LiveForge.java app/src/main/java/com/htt/StrikeTracker.java
          cp .ironmind_patch/HudView-LiveForge.java app/src/main/java/com/htt/HudView.java
          grep -q 'PASSIVE DEEP FORGE' app/src/main/java/com/htt/MainActivity.java
          grep -q 'comboRepetitions' app/src/main/java/com/htt/MainActivity.java
          grep -q 'class DeepEmbedView' app/src/main/java/com/htt/DeepEmbedView.java
          grep -q 'versionCode 7' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2 wrapper
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          grep -nE "(^| )error:|FAILURE:|What went wrong:|Execution failed|Could not resolve|Caused by:" /tmp/gradle-build.log | tail -240 > /tmp/concise-build-errors.txt || true
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ironmind-v4-deep-passive-build-log
          path: |
            /tmp/gradle-build.log
            /tmp/concise-build-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats.apk | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats.apk | tee dist/APK-BADGING-REPORT.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|WAKE_LOCK|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE)'" dist/APK-BADGING-REPORT.txt; then
            echo "Unexpected network/background permission found in final APK"
            exit 1
          fi
          sha256sum dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats.apk > dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          IRON MIND V4.3: DEEP PASSIVE FORGE + ADJUSTABLE REPEATS
          Package: com.vhanma.ironmindv4
          Version: 4.3-DeepPassive-AdjustableRepeats (code 7)
          Minimum Android: 6.0 / API 23
          Target Android: API 34
          Signing: Android debug signing
          Requested runtime permissions: camera and vibration only

          COMBO COACH
          Repeats per combo are selectable: 1, 2, 3, 5, 10, or 20.
          The same selector is included in Fusion Chamber.
          Quiet matched affirmations continue underneath active repetitions when enabled.

          PASSIVE DEEP FORGE
          Modes: Natural Coach, Deep Embed, Visual Threshold Lab, Peripheral Symbol, Sleep Consolidation, Fringe Laboratory.
          Visual delivery: visible card, glimpsed mask, borderline mask, masked pattern, peripheral prime, low-contrast texture, symbol only.
          Brief cue duration: adjustable from 17 to 300 ms.
          Three independent speech layers: natural coach, quiet reinforcement, fast texture voice.
          Independent volume controls for coach, whisper, and texture layers.
          Optional reverse-word texture, stable haptic anchors, golden-ratio spacing, ambient visual profiles, carrier audio, torch lab, and full delivery log.

          LIVE FORGE
          Session-specific guard calibration and separate left/right arm state machines remain included.
          Strike phases: guard, extension, peak, return, cooldown.
          False-positive controls: displacement, return requirement, landmark confidence, FPS and scale stability gates.
          Speed and force remain camera-derived estimates rather than direct sensor measurements.

          EXPERIMENTAL LAYERS
          Frequency and fringe presets are sound/visual constructions. The app does not claim automatic biological effects from a chosen number or carrier.
          REPORT
          zip -qr dist/IronMind-Hyperbolic-Chamber-v4.3-DeepPassive-AdjustableRepeats-Source.zip app build.gradle settings.gradle README.md .github .ironmind_patch

      - name: Upload final APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ironmind-hyperbolic-v4-deep-passive-adjustable-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30
