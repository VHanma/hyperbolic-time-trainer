name: Build Iron Mind V4.2 LiveForge Repeat5 APK

on:
  push:
    branches: [ master, v4-hyperbolic-chamber ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize Live Forge source
        shell: bash
        run: |
          set -euo pipefail
          cat .ironmind_payload/new/p* > /tmp/ironmind_payload.b64
          base64 --decode /tmp/ironmind_payload.b64 > /tmp/ironmind_v4_project.tar.gz
          tar -xzf /tmp/ironmind_v4_project.tar.gz -C "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/java/com/htt
          cp .ironmind_patch/app-build.gradle app/build.gradle
          sed -i 's/applicationId "com.htt"/applicationId "com.vhanma.ironmindv4"/' app/build.gradle
          sed -i 's/versionCode 4/versionCode 6/' app/build.gradle
          sed -i 's/versionName "4.0-Hyperbolic"/versionName "4.2-LiveForge-Repeat5"/' app/build.gradle
          sed -i 's/pose-detection-accurate:18.0.0-beta3/pose-detection:18.0.0-beta5/' app/build.gradle
          cp .ironmind_patch/SpeechEngine.java app/src/main/java/com/htt/SpeechEngine.java
          cp .ironmind_patch/MainActivity-LiveForge.java app/src/main/java/com/htt/MainActivity.java
          cp .ironmind_patch/StrikeTracker-LiveForge.java app/src/main/java/com/htt/StrikeTracker.java
          cp .ironmind_patch/HudView-LiveForge.java app/src/main/java/com/htt/HudView.java
          python .ironmind_patch/fix-liveforge-passive.py
          grep -q 'COMBO_REPETITIONS = 5' app/src/main/java/com/htt/MainActivity.java
          grep -q 'ArmPhase { GUARD, EXTENDING, RETURNING, COOLDOWN }' app/src/main/java/com/htt/StrikeTracker.java
          grep -q 'applicationId "com.vhanma.ironmindv4"' app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2 wrapper
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          grep -nE "(^| )error:|FAILURE:|What went wrong:|Execution failed|Could not resolve|Caused by:" /tmp/gradle-build.log | tail -220 > /tmp/concise-build-errors.txt || true
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ironmind-v4-liveforge-build-log
          path: |
            /tmp/gradle-build.log
            /tmp/concise-build-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and package deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5.apk | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5.apk | tee dist/APK-BADGING-REPORT.txt
          sha256sum dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5.apk > dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          IRON MIND V4.2: LIVE FORGE REPEAT5
          Package: com.vhanma.ironmindv4
          Version: 4.2-LiveForge-Repeat5 (code 6)
          Minimum Android: 6.0 / API 23
          Target Android: API 34
          Combo behavior: every selected combo is called five consecutive times before advancing
          Live detector: session-specific guard calibration and separate left/right arm state machines
          Strike phases: guard, extension, peak, return, cooldown
          False-positive controls: full-strike displacement, return requirement, landmark confidence, FPS and scale stability gates
          Readable status: calibration progress, active hand, return wait, ignored-motion reason and processed FPS
          Speed: camera-derived sampling-aware MPH range
          Force: modeled hypothetical impact range, not a direct load-cell measurement
          Signing: Android debug signing
          REPORT
          zip -qr dist/IronMind-Hyperbolic-Chamber-v4.2-LiveForge-Repeat5-Source.zip app build.gradle settings.gradle README.md .github .ironmind_patch

      - name: Upload final APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ironmind-hyperbolic-v4-liveforge-repeat5-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30
