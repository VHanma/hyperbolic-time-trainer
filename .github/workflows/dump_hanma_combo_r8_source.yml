name: Dump Hanma Combo R8 v802 Exact Source
on:
  push:
    branches: [ hanma-combo-r3 ]
    paths: [ '.github/workflows/dump_hanma_combo_r8_source.yml' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover checksum-locked v802 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          cat hanma-combo-r3/source_payload/TacticalEngine.v802.part* | base64 -d | gzip -d > recovered/TacticalEngine.java
          cat hanma-combo-r3/source_payload/MainActivity.v800.part* | base64 -d | gzip -d > recovered/MainActivity.java
          echo '2984058792a4e2377244f45fa5f626adc74dced4df0b1e4da4941246d733c830  recovered/TacticalEngine.java' | sha256sum -c -
          echo '33506ee39a06c5a38d10ce84482e8522d1504a5b575d50f00d073457a2d8bd70  recovered/MainActivity.java' | sha256sum -c -
          wc -l recovered/*.java | tee recovered/lines.txt
          sha256sum recovered/*.java | tee recovered/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r8-v802-exact-source
          path: recovered/*
          retention-days: 7
