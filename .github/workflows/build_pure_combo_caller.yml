name: Build Pure Combo Caller APK

on:
  push:
    branches: [ master, pure-combo-caller ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare and verify the 1693-call library
        shell: bash
        run: |
          set -euo pipefail
          cd combo-caller

          test "$(grep -cve '^\s*$' app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' app/src/main/assets/combos_named.txt)" -eq 498

          base64 -d app/src/main/assets/mycombat_795.tsv.gz.b64 | gunzip > app/src/main/assets/mycombat_795.tsv
          test "$(grep -cvE '^[[:space:]]*(#|$)' app/src/main/assets/mycombat_795.tsv)" -eq 795

          python - <<'PY'
          from pathlib import Path
          from collections import Counter

          data = Path('app/src/main/assets/mycombat_795.tsv')
          counts = Counter()
          total = 0
          for raw in data.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              style, combo = raw.split('\t', 1)
              style = style.strip()
              combo = combo.strip()
              if not style or not combo:
                  raise SystemExit(f'Bad MyCombat row: {raw!r}')
              counts[style] += 1
              total += 1

          expected = {
              'Boxing': 100,
              'Kickboxing': 100,
              'Muay Thai': 95,
              'MMA': 100,
              'Combat Sambo': 100,
              'BJJ': 150,
              'Wrestling': 100,
              'Judo': 50,
          }
          if total != 795 or dict(counts) != expected:
              raise SystemExit(f'MyCombat verification failed: total={total}, counts={dict(counts)}')

          p = Path('app/src/main/java/com/vhanma/purecombocaller/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          old_load = '''        readAsset("combos_codes.txt", "Code combinations");
          readAsset("combos_named.txt", "Named combinations");
          '''
          new_load = '''        readAsset("combos_codes.txt", "Code combinations");
          readAsset("combos_named.txt", "Named combinations");
          readTaggedAsset("mycombat_795.tsv");
          '''
          if old_load not in s:
              raise SystemExit('Expected loadCombos asset block missing')
          s = s.replace(old_load, new_load, 1)

          old_cleanup = '''        LinkedHashSet<String> seen = new LinkedHashSet<>();
          List<Combo> clean = new ArrayList<>();
          for (Combo combo : allCombos) {
              String key = combo.raw.trim();
              if (key.isEmpty()) continue;
              if (seen.add(key)) clean.add(combo);
          }
          allCombos.clear();
          allCombos.addAll(clean);
          '''
          if old_cleanup not in s:
              raise SystemExit('Expected combo cleanup block missing')
          s = s.replace(old_cleanup, '''        // Preserve every supplied slot, including intentional repeats and cross-style duplicates.\n''', 1)

          marker = '''    private String classify(String raw, String source) {
          '''
          tagged_method = '''    private void readTaggedAsset(String filename) {
              try (BufferedReader reader = new BufferedReader(new InputStreamReader(getAssets().open(filename)))) {
                  String line;
                  while ((line = reader.readLine()) != null) {
                      String trimmed = line.trim();
                      if (trimmed.isEmpty() || trimmed.startsWith("#")) continue;
                      String[] parts = line.split("\\t", 2);
                      if (parts.length != 2) continue;
                      String style = parts[0].trim();
                      String raw = parts[1].trim();
                      if (style.isEmpty() || raw.isEmpty()) continue;
                      allCombos.add(new Combo(raw, "MyCombat · " + style));
                  }
              } catch (Exception e) {
                  Toast.makeText(this, "Missing " + filename, Toast.LENGTH_LONG).show();
              }
          }

              private String classify(String raw, String source) {
          '''
          if marker not in s:
              raise SystemExit('Expected classify marker missing')
          s = s.replace(marker, tagged_method, 1)

          old_spinner = '''        Spinner category = spinner(new String[]{
                  "All combinations",
                  "Coded library",
                  "Named boxing",
                  "Muay Thai and kickboxing",
                  "Defense and footwork"
          });
          '''
          new_spinner = '''        Spinner category = spinner(new String[]{
                  "All combinations",
                  "MyCombat · Boxing",
                  "MyCombat · Kickboxing",
                  "MyCombat · Muay Thai",
                  "MyCombat · MMA",
                  "MyCombat · Combat Sambo",
                  "MyCombat · BJJ",
                  "MyCombat · Wrestling",
                  "MyCombat · Judo",
                  "Coded library",
                  "Named boxing",
                  "Muay Thai and kickboxing",
                  "Defense and footwork"
          });
          '''
          if old_spinner not in s:
              raise SystemExit('Expected library spinner block missing')
          s = s.replace(old_spinner, new_spinner, 1)
          s = s.replace('" unique combinations loaded"', '" callable combinations loaded"', 1)

          p.write_text(s, encoding='utf-8')
          PY

          # Give this build a distinct version label while retaining the same package.
          sed -i "s/versionCode 1/versionCode 2/" app/build.gradle
          sed -i "s/versionName '1.0-PureCaller'/versionName '1.1-1693'/" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd combo-caller
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd combo-caller
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/pure-combo-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pure-combo-caller-1693-build-log
          path: /tmp/pure-combo-build.log
          retention-days: 7

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Pure-Combo-Caller-v1.1-1693.apk
          cp combo-caller/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then
            echo 'Pure caller unexpectedly requests a permission'
            exit 1
          fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Pure-Combo-Caller-v1.1-1693-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          PURE COMBO CALLER V1.1 — 1693 CALLS
          Package: com.vhanma.purecombocaller
          Combination slots: 1693
          Existing coded slots: 400
          Existing named slots: 498
          MyCombat imported slots: 795
          MyCombat Boxing: 100
          MyCombat Kickboxing: 100
          MyCombat Muay Thai: 95
          MyCombat MMA: 100
          MyCombat Combat Sambo: 100
          MyCombat BJJ: 150
          MyCombat Wrestling: 100
          MyCombat Judo: 50
          Camera: absent
          Video analysis: absent
          Pose detection: absent
          Network: absent
          Runtime permissions: none
          Repeat options: 1, 2, 3, 5, 10, 20
          Order modes: random, shuffle deck, sequential
          Call intervals: 2, 3, 4, 5, 6, 8, 10, 12, 15 seconds
          Round lengths: 1, 3, 5, 10, 20 minutes, endless
          Voice: Android offline-capable TextToSpeech engine
          REPORT
          (cd combo-caller && zip -qr ../dist/Pure-Combo-Caller-v1.1-1693-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: pure-combo-caller-v1.1-1693
          path: dist/*
          if-no-files-found: error
          retention-days: 30
