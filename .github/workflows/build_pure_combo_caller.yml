name: Build Pure Combo Caller APK

on:
  push:
    branches: [ master, pure-combo-caller ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare crash-hardened 1693-call library
        shell: bash
        run: |
          set -euo pipefail
          cd combo-caller

          test "$(grep -cve '^\s*$' app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' app/src/main/assets/combos_named.txt)" -eq 498
          base64 -d app/src/main/assets/mycombat_795.tsv.gz.b64 | gunzip > app/src/main/assets/mycombat_795.tsv
          test "$(grep -cvE '^[[:space:]]*(#|$)' app/src/main/assets/mycombat_795.tsv)" -eq 795

          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          data = Path('app/src/main/assets/mycombat_795.tsv')
          counts = Counter()
          total = 0
          for raw in data.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              style, combo = raw.split('\t', 1)
              style, combo = style.strip(), combo.strip()
              if not style or not combo:
                  raise SystemExit(f'Bad MyCombat row: {raw!r}')
              counts[style] += 1
              total += 1

          expected = {
              'Boxing': 100, 'Kickboxing': 100, 'Muay Thai': 95, 'MMA': 100,
              'Combat Sambo': 100, 'BJJ': 150, 'Wrestling': 100, 'Judo': 50,
          }
          if total != 795 or dict(counts) != expected:
              raise SystemExit(f'MyCombat verification failed: total={total}, counts={dict(counts)}')

          p = Path('app/src/main/java/com/vhanma/purecombocaller/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          # Add the MyCombat asset and preserve every supplied slot.
          needle = 'readAsset("combos_named.txt", "Named combinations");'
          if needle not in s:
              raise SystemExit('Named library load line missing')
          s = s.replace(needle, needle + '\n        readTaggedAsset("mycombat_795.tsv");', 1)

          cleanup = re.compile(r'\n\s*LinkedHashSet<String> seen = new LinkedHashSet<>\(\);.*?allCombos\.addAll\(clean\);\s*', re.S)
          s, n = cleanup.subn('\n        // Preserve all supplied slots, including intentional repeats and cross-style duplicates.\n', s, count=1)
          if n != 1:
              raise SystemExit('Could not remove source dedupe block')

          classify_marker = '    private String classify(String raw, String source) {'
          tagged_method = '''    private void readTaggedAsset(String filename) {
              try (BufferedReader reader = new BufferedReader(new InputStreamReader(getAssets().open(filename)))) {
                  String line;
                  while ((line = reader.readLine()) != null) {
                      String trimmed = line.trim();
                      if (trimmed.isEmpty() || trimmed.startsWith("#")) continue;
                      String[] parts = line.split("\\t", 2);
                      if (parts.length != 2) continue;
                      String style = parts[0].trim();
                      String raw = parts[1].trim();
                      if (style.isEmpty() || raw.isEmpty()) continue;
                      allCombos.add(new Combo(raw, "MyCombat · " + style));
                  }
              } catch (Throwable e) {
                  Toast.makeText(this, "Could not load " + filename, Toast.LENGTH_LONG).show();
              }
          }

          '''
          if classify_marker not in s:
              raise SystemExit('classify method marker missing')
          s = s.replace(classify_marker, tagged_method + classify_marker, 1)

          styles = [
              'MyCombat · Boxing', 'MyCombat · Kickboxing', 'MyCombat · Muay Thai',
              'MyCombat · MMA', 'MyCombat · Combat Sambo', 'MyCombat · BJJ',
              'MyCombat · Wrestling', 'MyCombat · Judo'
          ]
          pattern = re.compile(r'(?m)^(\s*)"All combinations",\s*$')
          def add_styles(match):
              indent = match.group(1)
              return match.group(0) + '\n' + '\n'.join(indent + '"' + x + '",' for x in styles)
          s, n = pattern.subn(add_styles, s, count=1)
          if n != 1:
              raise SystemExit('All combinations spinner entry missing')
          s = s.replace(' unique combinations loaded', ' callable combinations loaded', 1)

          # Voice engine is now lazy. It is no longer touched during app startup.
          s = s.replace('    private TextToSpeech tts;\n', '    private TextToSpeech tts;\n    private String pendingSpeech;\n', 1)

          old_oncreate = '''    @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(BG);
              getWindow().setNavigationBarColor(BG);
              tts = new TextToSpeech(this, this);
              loadCombos();
              showSetup();
          }
          '''
          new_oncreate = '''    @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
              } catch (Throwable ignored) {}
              try {
                  loadCombos();
                  showSetup();
              } catch (Throwable t) {
                  showStartupError(t);
              }
          }
          '''
          if old_oncreate not in s:
              raise SystemExit('onCreate block missing')
          s = s.replace(old_oncreate, new_oncreate, 1)

          old_oninit = '''    @Override public void onInit(int status) {
              if (status == TextToSpeech.SUCCESS) {
                  ttsReady = true;
                  tts.setLanguage(Locale.US);
                  tts.setSpeechRate(speechRate);
                  tts.setPitch(1.0f);
              }
          }
          '''
          new_oninit = '''    @Override public void onInit(int status) {
              if (status == TextToSpeech.SUCCESS && tts != null) {
                  try {
                      ttsReady = true;
                      tts.setLanguage(Locale.US);
                      tts.setSpeechRate(speechRate);
                      tts.setPitch(1.0f);
                      if (pendingSpeech != null) {
                          String queued = pendingSpeech;
                          pendingSpeech = null;
                          tts.speak(queued, TextToSpeech.QUEUE_FLUSH, null, "combo-ready");
                      }
                  } catch (Throwable t) {
                      ttsReady = false;
                  }
              }
          }
          '''
          if old_oninit not in s:
              raise SystemExit('onInit block missing')
          s = s.replace(old_oninit, new_oninit, 1)

          load_marker = '    private void loadCombos() {'
          helpers = '''    private void ensureTts() {
              if (tts != null || ttsReady) return;
              try {
                  tts = new TextToSpeech(getApplicationContext(), this);
              } catch (Throwable t) {
                  tts = null;
                  ttsReady = false;
                  Toast.makeText(this, "Voice engine unavailable. Caller will still run silently.", Toast.LENGTH_LONG).show();
              }
          }

          private void showStartupError(Throwable t) {
              try {
                  TextView error = new TextView(this);
                  error.setTextColor(Color.WHITE);
                  error.setBackgroundColor(BG);
                  error.setTextSize(18);
                  error.setPadding(dp(20), dp(30), dp(20), dp(30));
                  String detail = t.getClass().getSimpleName();
                  if (t.getMessage() != null && !t.getMessage().trim().isEmpty()) detail += ": " + t.getMessage();
                  error.setText("PURE COMBO CALLER\\n\\nStartup recovery mode\\n\\n" + detail + "\\n\\nThe process stayed alive so this error can be identified.");
                  setContentView(error);
              } catch (Throwable ignored) {}
          }

          '''
          if load_marker not in s:
              raise SystemExit('loadCombos marker missing')
          s = s.replace(load_marker, helpers + load_marker, 1)

          old_speak = '''    private void speak(String text) {
              if (!ttsReady) {
                  Toast.makeText(this, "Voice engine is still loading.", Toast.LENGTH_SHORT).show();
                  return;
              }
              tts.setSpeechRate(speechRate);
              tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "combo-" + System.nanoTime());
          }
          '''
          new_speak = '''    private void speak(String text) {
              if (!ttsReady || tts == null) {
                  pendingSpeech = text;
                  ensureTts();
                  return;
              }
              try {
                  tts.setSpeechRate(speechRate);
                  tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "combo-" + System.nanoTime());
              } catch (Throwable t) {
                  ttsReady = false;
                  tts = null;
                  Toast.makeText(this, "Voice failed. Training continues silently.", Toast.LENGTH_SHORT).show();
              }
          }
          '''
          if old_speak not in s:
              raise SystemExit('speak block missing')
          s = s.replace(old_speak, new_speak, 1)

          # Null-safe voice shutdown/pause and guarded system UI calls.
          s = s.replace('if (ttsReady) tts.stop();', 'if (ttsReady && tts != null) tts.stop();')
          s = s.replace('        leaveImmersive();\n        stopInternal();', '        try { leaveImmersive(); } catch (Throwable ignored) {}\n        stopInternal();', 1)
          s = s.replace('        enterImmersive();\n        showCallerScreen();', '        try { enterImmersive(); } catch (Throwable ignored) {}\n        showCallerScreen();', 1)

          # Launching a round starts voice initialization, but failure can never block the caller UI.
          s = s.replace('            prepareActiveList();\n', '            prepareActiveList();\n            ensureTts();\n', 1)

          required = ['readTaggedAsset("mycombat_795.tsv")', 'private void ensureTts()', 'private void showStartupError(Throwable t)'] + styles
          missing = [x for x in required if x not in s]
          if missing or 'LinkedHashSet<String> seen' in s or 'tts = new TextToSpeech(this, this);' in s:
              raise SystemExit(f'Crash-hardening verification failed: missing={missing}')

          p.write_text(s, encoding='utf-8')
          PY

          sed -i "s/versionCode 1/versionCode 3/" app/build.gradle
          sed -i "s/versionName '1.0-PureCaller'/versionName '1.2-CrashFix'/" app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd combo-caller
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd combo-caller
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/pure-combo-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pure-combo-caller-v1.2-crashfix-build-log
          path: /tmp/pure-combo-build.log
          retention-days: 7

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Pure-Combo-Caller-v1.2-CrashFix.apk
          cp combo-caller/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then
            echo 'Pure caller unexpectedly requests a permission'
            exit 1
          fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          unzip -p "$APK" assets/mycombat_795.tsv | grep -cvE '^[[:space:]]*(#|$)' | grep -qx '795'
          sha256sum "$APK" > dist/Pure-Combo-Caller-v1.2-CrashFix-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          PURE COMBO CALLER V1.2 - CRASHFIX
          Package: com.vhanma.purecombocaller
          Combination slots: 1693
          Existing coded slots: 400
          Existing named slots: 498
          MyCombat imported slots: 795
          Voice initialization: lazy / startup-safe
          Startup recovery screen: enabled
          System UI calls: guarded
          Asset reads: guarded
          Runtime permissions: none
          Network: absent
          REPORT
          (cd combo-caller && zip -qr ../dist/Pure-Combo-Caller-v1.2-CrashFix-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: pure-combo-caller-v1.2-crashfix
          path: dist/*
          if-no-files-found: error
          retention-days: 30
