name: Build Hanma Combo Caller R3 APK

on:
  push:
    branches: [ hanma-combo-r3 ]
    paths:
      - 'hanma-combo-r3/**'
      - '.github/workflows/build_hanma_combo_r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize R3.1.2 source and verify inherited library
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_named.txt)" -eq 498
          SRC=hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3
          mkdir -p "$SRC"
          cat hanma-combo-r3/source_payload/MainActivity.v312.part* | base64 -d | gzip -d > "$SRC/MainActivity.java"
          cat hanma-combo-r3/source_payload/TacticalEngine.v311.part* | base64 -d | gzip -d > "$SRC/TacticalEngine.java"
          echo 'b83098830ea7f31150b6e83f044856df90019809bac26b3bf2b597f4891be2ef  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/MainActivity.java' | sha256sum -c -
          echo '6dfc54c251b10abeeffb36e6eb16b6639109b083ff68b8ccb34490cfa9c142fa  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java' | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Logic compile sanity check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3-logic
          javac -d /tmp/r3-logic hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-combo-r3
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd hanma-combo-r3
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/hanma-r3-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-r3-build-log
          path: /tmp/hanma-r3-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Hanma-Combo-Caller-R3-v3.1.2.apk
          cp hanma-combo-r3/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          grep -q "package: name='com.vhanma.hanmacombocallerr3'" dist/APK-BADGING-REPORT.txt
          grep -q "versionCode='312'" dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then exit 1; fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Hanma-Combo-Caller-R3-v3.1.2-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          HANMA COMBO CALLER R3 v3.1.2 STARTUP HOTFIX
          Package: com.vhanma.hanmacombocallerr3
          Original 898 supplied combo slots preserved.
          Startup is staged: UI first, tactical engine second, TTS last.
          Tactical engine and voice failures are isolated instead of terminating the Activity.
          Corrupt R3 shard/custom preferences self-recover.
          Recovery screen replaces silent startup termination.
          Spinner construction simplified for device compatibility.
          Window/immersive calls are guarded.
          Camera: absent
          Microphone: absent
          Network: absent
          Runtime permissions: none
          REPORT
          (cd hanma-combo-r3 && zip -qr ../dist/Hanma-Combo-Caller-R3-v3.1.2-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          zip -j dist/Hanma-Combo-Caller-R3-v3.1.2-Source.zip combo-caller/app/src/main/assets/combos_codes.txt combo-caller/app/src/main/assets/combos_named.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-caller-r3-v3-1-2-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish R3.1.2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hanma-combo-r3-v3.1.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hanma Combo Caller R3 v3.1.2" --notes "Startup hotfix: staged boot, engine/TTS isolation, corrupt-setting recovery, compatibility-safe spinners, guarded window calls, and an in-app recovery screen instead of silent startup termination."
          fi
