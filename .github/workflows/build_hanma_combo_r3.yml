name: Build Hanma Combo Caller R3 APK

on:
  push:
    branches: [ hanma-combo-r3 ]
    paths:
      - 'hanma-combo-r3/**'
      - '.github/workflows/build_hanma_combo_r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize R3.1.1 source and verify inherited library
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_named.txt)" -eq 498
          SRC=hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3
          mkdir -p "$SRC"
          cat hanma-combo-r3/source_payload/MainActivity.v311.part* | base64 -d | gzip -d > "$SRC/MainActivity.java"
          cat hanma-combo-r3/source_payload/TacticalEngine.v311.part* | base64 -d | gzip -d > "$SRC/TacticalEngine.java"
          echo '6df9f66f76829497dd9bbcceb94bd58a1182b5b4aca912029b28af553f585ae1  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/MainActivity.java' | sha256sum -c -
          echo '6dfc54c251b10abeeffb36e6eb16b6639109b083ff68b8ccb34490cfa9c142fa  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java' | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Logic compile sanity check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r3-logic
          javac -d /tmp/r3-logic hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-combo-r3
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd hanma-combo-r3
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/hanma-r3-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-r3-build-log
          path: /tmp/hanma-r3-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Hanma-Combo-Caller-R3-v3.1.1.apk
          cp hanma-combo-r3/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          grep -q "package: name='com.vhanma.hanmacombocallerr3'" dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then
            echo 'R3 unexpectedly requests a permission'
            exit 1
          fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Hanma-Combo-Caller-R3-v3.1.1-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          HANMA COMBO CALLER R3 v3.1.1
          Package: com.vhanma.hanmacombocallerr3
          Install behavior: side-by-side clone; legacy app remains untouched
          Supplied combo slots preserved: 898
          Coded slots: 400
          Named slots: 498
          Modes: Fight Simulator, Adaptive Fight IQ, Open Exchange, Counter Drill, Pressure Hunt, MMA Transition, Reaction Flash, Skill Shards, Pure Library
          Opponent brains: Adaptive Rival, Pressure Fighter, Counter Striker, Wrestler, Southpaw Sniper, High Guard Shell, Long Kicker, Dirty Boxer, Submission Hunter, Chaos Rival
          Tactical grammar: range-aware setup/defense/attack/continuation/maneuver/phase-transition chains
          Defensive event matching: punch, shot, clinch, teep, body-kick, low-kick
          Fighter DNA: three-profile percentage mixer
          Strategies: Hanma Synthesis, Musashi Initiative, Sun Tzu Manipulation, 52 Blocks Sentinel, Scientific MMA, Chaos Adaptation
          Memory: theme rotation, anti-repeat openings, failure adaptation, success escalation
          Difficulty: manual 1-10 plus automatic evolution
          Skill shards: persistent repetitions, AUTOMATIC threshold, mastered-shard fusion
          Custom technique lab: supported
          Interactive feedback: LANDED / DEFENDED / RESET STATE
          Manual feedback cancels pending automatic calls
          Camera: absent
          Microphone: absent
          Network: absent
          Runtime permissions: none
          REPORT
          (cd hanma-combo-r3 && zip -qr ../dist/Hanma-Combo-Caller-R3-v3.1.1-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          zip -j dist/Hanma-Combo-Caller-R3-v3.1.1-Source.zip combo-caller/app/src/main/assets/combos_codes.txt combo-caller/app/src/main/assets/combos_named.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-caller-r3-v3-1-1-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish R3.1.1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hanma-combo-r3-v3.1.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Hanma Combo Caller R3 v3.1.1" \
              --notes "Rival 3 fight-simulator build with opponent brains, range-aware tactical grammar, three-way Fighter DNA mixer, adaptive memory and difficulty, round personas, Musashi/Sun Tzu/52 Blocks strategy layers, Open Exchange, Reaction Flash, persistent Skill Shards, custom technique lab, interactive fight feedback, event-specific defense matching, and double-call prevention. Original app remains untouched."
          fi
