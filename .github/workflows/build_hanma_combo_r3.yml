name: Build Hanma Combo Caller R5 APK

on:
  push:
    branches: [ hanma-combo-r3 ]
    paths:
      - 'hanma-combo-r3/**'
      - '.github/workflows/build_hanma_combo_r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize R5.0.0 source and verify inherited library
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_named.txt)" -eq 498
          SRC=hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3
          mkdir -p "$SRC"
          cat hanma-combo-r3/source_payload/MainActivity.v500.b64 | base64 -d | gzip -d > "$SRC/MainActivity.java"
          cat hanma-combo-r3/source_payload/TacticalEngine.v500.part* | base64 -d | gzip -d > "$SRC/TacticalEngine.java"
          echo '1347b68469182a59238415406443c05e2f85144dd6ca27b407799d8069d55870  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/MainActivity.java' | sha256sum -c -
          echo '32a3b379c7c4bcf5852f342c2fc479cc7ff5144bad731919ac439029fecf238b  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java' | sha256sum -c -
          grep -q 'MainActivity.this::scheduleNextAfterSpeech' "$SRC/MainActivity.java"
          ! grep -q 'handler.post(this::scheduleNextAfterSpeech)' "$SRC/MainActivity.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: R5 tactical-engine stress test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r5-logic
          javac -d /tmp/r5-logic hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java
          cat > /tmp/R5Harness.java <<'JAVA'
          import com.vhanma.hanmacombocallerr3.TacticalEngine;
          import java.util.*;
          public class R5Harness {
            public static void main(String[] args) {
              TacticalEngine e = new TacticalEngine(Arrays.asList("Jab Cross","Slip Cross"), Arrays.asList("1-2","2-3"));
              String[] f={"RESET","CLEAN","LATE","BLOCKED","MISSED","COUNTERED","CLEAN","AUTO"};
              int calls=0;
              for(String mode:TacticalEngine.MODES){
                if(mode.equals("Ghost Replay")) continue;
                TacticalEngine.Config c=new TacticalEngine.Config();
                c.mode=mode; c.baseDifficulty=8; c.opponent="Adaptive Rival";
                c.persistentRivalMemory=true; c.powerIntent=true; c.arenaIQ=true; c.returnFireIQ=true;
                e.setConfig(c);
                for(int i=0;i<400;i++){
                  TacticalEngine.Result r=e.next(f[i%f.length]);
                  if(r==null||r.cue==null||r.cue.trim().isEmpty()) throw new RuntimeException("empty cue "+mode);
                  if(r.arena==null||r.initiative==null||r.powerPlan==null||r.returnFire==null||r.expectation==null) throw new RuntimeException("missing R5 intel "+mode);
                  calls++;
                }
              }
              for(String opp:TacticalEngine.OPPONENTS) for(String strategy:TacticalEngine.STRATEGIES){
                TacticalEngine.Config c=new TacticalEngine.Config();
                c.mode="Fight Simulator"; c.opponent=opp; c.strategy=strategy; c.baseDifficulty=10;
                c.persistentRivalMemory=true; c.powerIntent=true; c.arenaIQ=true; c.returnFireIQ=true;
                e.setConfig(c);
                for(int i=0;i<80;i++){
                  TacticalEngine.Result r=e.next(f[i%f.length]);
                  if(r==null||r.cue==null||r.cue.isEmpty()) throw new RuntimeException("empty matrix cue");
                  if(r.arena==null||r.initiative==null||r.powerPlan==null||r.returnFire==null||r.expectation==null) throw new RuntimeException("missing matrix intel");
                  calls++;
                }
              }
              String shard=e.exportShardState(); e.importShardState(shard);
              String combat=e.exportCombatState(); e.importCombatState(combat);
              if(!combat.startsWith("R5|")) throw new RuntimeException("bad R5 combat state");
              if(calls!=13200) throw new RuntimeException("unexpected call count "+calls);
              System.out.println("R5 stress OK calls="+calls+" shardBytes="+shard.length()+" combatBytes="+combat.length());
            }
          }
          JAVA
          javac -cp /tmp/r5-logic -d /tmp/r5-logic /tmp/R5Harness.java
          java -cp /tmp/r5-logic R5Harness

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-combo-r3
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd hanma-combo-r3
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/hanma-r5-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-r5-build-log
          path: /tmp/hanma-r5-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Hanma-Combo-Caller-R5-v5.0.0.apk
          cp hanma-combo-r3/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          grep -q "package: name='com.vhanma.hanmacombocallerr3'" dist/APK-BADGING-REPORT.txt
          grep -q "versionCode='500'" dist/APK-BADGING-REPORT.txt
          grep -q "versionName='5.0.0-Rival3'" dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then
            echo 'R5 unexpectedly requests a permission'
            exit 1
          fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Hanma-Combo-Caller-R5-v5.0.0-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          HANMA COMBO CALLER R5 v5.0.0
          Package: com.vhanma.hanmacombocallerr3
          Upgrades R4.0.2 in place; legacy Pure Combo Caller remains separate.
          Original supplied combo slots: 898 (400 coded + 498 named).

          R5 COMBAT INTELLIGENCE
          - Persistent rival memory across rounds and sessions.
          - Per-opponent performance memory and adaptive archetype selection.
          - Threat expectation model with decay, conditioning, and complementary exploitation.
          - CLEAN / LATE / BLOCKED / MISSED / COUNTERED outcome feedback.
          - Initiative and momentum state: you lead / contested / rival leads.
          - Cage geometry: center / open space / fence / corner.
          - Return-fire prediction by opponent family and exchange context.
          - Power-intent planner: loose setups, one primary commit shot, balanced finish.
          - Kinetic/body-position combination graph for position-compatible continuations.
          - Persistent Skill Shards plus wider persistent combat memory.
          - Exact Ghost Replay with R5 expectation, power-plan, and return-fire data.
          - New R5 techniques include flicker jab, body-hook touch, cross rangefinder,
            lead-step cross, shifting cross, chopping cross, lead/rear round kicks,
            Brazilian kick, and spinning back fist.
          - Existing PROBE / ESTABLISH / CONDITION / EXPLOIT / ADAPT round planning retained.
          - 13,200-exchange automated tactical stress matrix before Android compilation.

          Camera: absent
          Microphone: absent
          Network: absent
          Runtime permissions: none
          REPORT
          (cd hanma-combo-r3 && zip -qr ../dist/Hanma-Combo-Caller-R5-v5.0.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          zip -j dist/Hanma-Combo-Caller-R5-v5.0.0-Source.zip combo-caller/app/src/main/assets/combos_codes.txt combo-caller/app/src/main/assets/combos_named.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-caller-r5-v5-0-0-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish R5.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hanma-combo-r5-v5.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hanma Combo Caller R5 v5.0.0" --notes "Rival 3 R5 combat-intelligence rewrite: persistent rival memory, expectation/conditioning model, cage geometry, initiative, return-fire prediction, power-intent planning, body-position combo graph, expanded feedback, deeper Ghost Replay, and a 13,200-exchange pre-build stress matrix."
          fi
