name: Build Hanma Combo Caller R7 Omega APK

on:
  push:
    branches: [ hanma-combo-r3 ]
    paths:
      - 'hanma-combo-r3/**'
      - '.github/workflows/build_hanma_combo_r3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize R7 Omega source and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_codes.txt)" -eq 400
          test "$(grep -cve '^\s*$' combo-caller/app/src/main/assets/combos_named.txt)" -eq 498
          SRC=hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3
          mkdir -p "$SRC"
          cat hanma-combo-r3/source_payload/TacticalEngine.v700.part* | base64 -d | gzip -d > "$SRC/TacticalEngine.java"
          cat hanma-combo-r3/source_payload/MainActivity.v700.part* | base64 -d | gzip -d > "$SRC/MainActivity.java"
          echo '546eb938bc314e0f1758f617374d01f8683da57d0920163174cd2b37e9888841  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java' | sha256sum -c -
          echo '12e8d0ca79482c6ce74173b9d11b3f61f37ab9bc60ff7e7a6cd5c7c088cde712  hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/MainActivity.java' | sha256sum -c -
          grep -q 'R7 Ω FIGHT SIMULATOR' "$SRC/TacticalEngine.java"
          grep -q 'R7 Ω FIGHT INTELLIGENCE' "$SRC/MainActivity.java"
          grep -q 'counterfactualScore' "$SRC/TacticalEngine.java"
          grep -q 'opponentBeliefs' "$SRC/TacticalEngine.java"
          grep -q 'primitiveTrace' "$SRC/TacticalEngine.java"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: R7 Omega combat-intelligence stress test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r7logic
          javac -d /tmp/r7logic hanma-combo-r3/app/src/main/java/com/vhanma/hanmacombocallerr3/TacticalEngine.java
          cat > /tmp/R7Harness.java <<'JAVA'
          import com.vhanma.hanmacombocallerr3.TacticalEngine;
          import java.util.*;
          public class R7Harness {
            static String[] FB={"RESET","CLEAN","LATE","BLOCKED","MISSED","COUNTERED","CLEAN","CLEAN"};
            static int calls=0,dj=0,ground=0;
            static String first(String cue){int i=cue.indexOf(" → ");return (i<0?cue:cue.substring(0,i)).toLowerCase(Locale.US);}
            static void check(TacticalEngine e,TacticalEngine.Result r){
              if(r==null||r.cue==null||r.cue.trim().isEmpty()) throw new RuntimeException("empty cue");
              String t=e.getLastThreat();
              if(!"NONE".equals(t)&&!"Pure Library".equals(e.getConfig().mode)&&!e.lastResponseSolvedThreat()) throw new RuntimeException("unsolved "+t+" | "+r.cue);
              String ev=r.opponentEvent.toLowerCase(Locale.US),f=first(r.cue);
              if(ev.contains("double jab")){
                dj++;
                if(!(f.startsWith("catch first jab, slip second")||f.startsWith("double parry jabs")||f.startsWith("step outside double jab"))) throw new RuntimeException("bad double jab: "+r.cue);
                if(f.contains("kick")||f.contains("sprawl")) throw new RuntimeException("double-jab mismatch: "+r.cue);
              }
              if(!ev.contains("body kick")&&f.equals("catch body kick")) throw new RuntimeException("body-kick catch leak");
              if(!ev.contains("teep")&&f.contains("catch teep")) throw new RuntimeException("teep catch leak");
              if(!"Pure Library".equals(e.getConfig().mode)){
                if(r.why==null||!r.why.contains("SOURCE →")) throw new RuntimeException("missing source-backed WHY");
                if(r.mind==null||!r.mind.contains("HE EXPECTS:")) throw new RuntimeException("missing Omega Mind");
              }
              String gs=e.getGroundState(); if(gs.contains("BOTTOM")||gs.contains("TOP")||gs.contains("SCRAMBLE"))ground++;
              calls++;
            }
            public static void main(String[] args){
              TacticalEngine e=new TacticalEngine(Arrays.asList("Jab Cross","Slip Cross"),Arrays.asList("1-2","2-3"));
              String v=e.validateKnowledge(); if(!v.isEmpty()) throw new RuntimeException(v);
              for(String mode:TacticalEngine.MODES) for(String opp:TacticalEngine.OPPONENTS) for(String range:new String[]{"Long","Boxing","Pocket","Clinch","Ground","Top"}){
                TacticalEngine.Config c=new TacticalEngine.Config();c.mode=mode;c.opponent=opp;c.startRange=range;c.difficulty=10;e.setConfig(c);
                for(int i=0;i<240;i++)check(e,e.next(FB[i%FB.length]));
              }
              String state=e.exportCombatState(); if(!state.startsWith("R7|"))throw new RuntimeException("bad state"); e.importCombatState(state);
              if(dj<200)throw new RuntimeException("low double-jab coverage "+dj);
              if(ground<500)throw new RuntimeException("low ground coverage "+ground);
              System.out.println("R7 OMEGA HARNESS OK calls="+calls+" doubleJab="+dj+" ground="+ground+" stateBytes="+state.length());
            }
          }
          JAVA
          javac -cp /tmp/r7logic -d /tmp/r7logic /tmp/R7Harness.java
          java -cp /tmp/r7logic R7Harness

      - name: Set up Gradle 8.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          cd hanma-combo-r3
          /tmp/gradle-dist/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          cd hanma-combo-r3
          ./gradlew --no-daemon clean assembleRelease 2>&1 | tee /tmp/hanma-r7-build.log

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-r7-build-log
          path: /tmp/hanma-r7-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/Hanma-Combo-Caller-R7-Omega-v7.0.0.apk
          cp hanma-combo-r3/app/build/outputs/apk/release/app-release.apk "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE-REPORT.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/APK-BADGING-REPORT.txt
          grep -q "package: name='com.vhanma.hanmacombocallerr3'" dist/APK-BADGING-REPORT.txt
          grep -q "versionCode='700'" dist/APK-BADGING-REPORT.txt
          grep -q "versionName='7.0.0-Omega'" dist/APK-BADGING-REPORT.txt
          if grep -q "uses-permission:" dist/APK-BADGING-REPORT.txt; then echo 'R7 unexpectedly requests a permission'; exit 1; fi
          unzip -t "$APK" | tail -1 | tee dist/APK-ARCHIVE-REPORT.txt
          sha256sum "$APK" > dist/Hanma-Combo-Caller-R7-Omega-v7.0.0-SHA256.txt
          cat > dist/BUILD-REPORT.txt <<'REPORT'
          HANMA COMBO CALLER R7 OMEGA v7.0.0
          Package: com.vhanma.hanmacombocallerr3
          Upgrades R6 in place.
          Original supplied combo slots preserved: 898 (400 coded + 498 named).
          OMEGA ARCHITECTURE:
          - Threat-first causal defense graph.
          - Momentum/mechanics ledger: range, loaded side, balance, guard, commitment debt and initiative.
          - Purpose-before-technique planning.
          - Counterfactual shell/pull/shot/return-fire scoring.
          - Opponent belief model for conditioning and expectation betrayal.
          - Delayed causal credit across setup chains.
          - Ghost/Doppelganger habit pressure against predictable patterns.
          - Technique primitive traces and morph-strike branches.
          - Ground hierarchy and control-before-submission legality.
          - Source-backed WHY screen grounded in Technique_Merged_Biomechanics Vol.1 and Vol.3.
          - 115,200-exchange local/CI stress matrix.
          Camera: absent
          Microphone: absent
          Network: absent
          Runtime permissions: none
          REPORT
          (cd hanma-combo-r3 && zip -qr ../dist/Hanma-Combo-Caller-R7-Omega-v7.0.0-Source.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          zip -j dist/Hanma-Combo-Caller-R7-Omega-v7.0.0-Source.zip combo-caller/app/src/main/assets/combos_codes.txt combo-caller/app/src/main/assets/combos_named.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hanma-combo-caller-r7-omega-v7-0-0-final
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish R7 Omega release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=hanma-combo-r7-omega-v7.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hanma Combo Caller R7 Omega v7.0.0" --notes "Rival Omega architecture rebuild: causal threat solver, mechanics/momentum ledger, purpose-first planning, counterfactual reply simulation, opponent beliefs, commitment debt, delayed tactical credit, Doppelganger habit pressure, primitive technique traces and source-backed WHY reasoning."
          fi
